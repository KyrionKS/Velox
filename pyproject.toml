[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velox"
version = "0.1.0"
description = "Velox - a standalone Python port of a Tdarr plugin stack for video remuxing/transcoding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Velox" }]
keywords = ["ffmpeg", "transcode", "hevc", "tdarr", "remux"]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
velox = "velox.cli:main"
velox-gui = "velox.gui.app:main"

[tool.setuptools.packages.find]
include = ["velox*"]

[tool.ruff]
line-length = 100
target-version = "py311"
