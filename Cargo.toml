[workspace]
resolver = "2"
members = ["crates/velox-core", "crates/velox-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KyrionKS"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "fs",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
serde_ignored = "0.1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
